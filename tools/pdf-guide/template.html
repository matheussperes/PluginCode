<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="cover">
    <h1 class="cover-title">{{TITLE}}</h1>
    <p class="cover-subtitle">{{SUBTITLE}}</p>
    <p class="cover-meta">Versão {{VERSION}} — {{DATE}}</p>
  </section>

  <section class="toc" id="sumario">
    <h1>Sumário</h1>
    {{TOC}}
  </section>

  <main class="content">
    {{CONTENT}}
  </main>
</body>
</html>
